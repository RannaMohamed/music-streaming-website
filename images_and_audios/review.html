<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/> 
    <link href="Content/bootstrap.min.css" rel="stylesheet" href=bootstrap.bundle.min.js/>
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>BeatPulse</h1>
        </div>
        <nav class="navigation">
            <a href="TrialMusic .html">Home</a>
            <a href="about.html">About Us</a>
            <a href="review.html">Reviews</a>
            <a href="ArtistsPages.html">Artists</a>
            <div class="btn-group">
                <button
                  class="btn btn-secondary dropdown-toggle"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  GENRE
                </button>
                <ul class="dropdown-menu bg-dark text-white">
                  <li><a class="dropdown-item" data-genre="Pop" href="#">Pop</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" data-genre="Rock" href="#">Rock</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" data-genre="Rap" href="#">Rap</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" data-genre="Electronic" href="#">Electronic</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item"data-genre="Country" href="#">Country</a></li>
                </ul>
              </div>
        </nav>
    </header>
    <main class="main">
        <div id="songs-container"></div>
        <h2>Reviews</h2>
        <p>Welcome to the Reviews page!</p>
        <div id="reviews-container">
            The reviews appear here
        </div>
        <form id="review-form" action="#">
            <label for="song-name">Song Name:</label>
            <input type="text" id="song-name" name="song-name" placeholder="Enter song name">
            <br>
            <label for="user-name">User Name:</label>
            <input type="text" id="user-name" name="user-name" placeholder="Enter your name">
            <br>
            <label for="review">Review:</label>
            <textarea id="review" name="review" rows="5" placeholder="Write your review here"></textarea>
            <br>
            <button type="submit">Submit Review</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
